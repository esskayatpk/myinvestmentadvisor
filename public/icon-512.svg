      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- App shell background -->
  <rect width="512" height="512" rx="100" fill="#111827"/>
